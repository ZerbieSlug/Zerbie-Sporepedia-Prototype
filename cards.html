<script>
var db_audio_flg = document.getElementById("music-on");
  var audio = new Audio('bg-music.mp3');
function play() {
  if (audio_flg == 0) {
  audio.play();
  audio_flg = 1;
  db_audio_flg.textContent = audio_flg;
  }
}

function pause() {
if (audio_flg == 1) {
audio.pause();
audio.currentTime = 0;
audio_flg = 0;
db_audio_flg.textContent = audio_flg;
}
}
</script>

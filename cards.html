<!DOCTYPE html>
<html lang="en">
<head>
 <meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bootstrap Style Link even tho I barely used it for this but somehow the layout is dependent on it now??? -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Base Style Link -->
<link href="style.css" rel="stylesheet">
<!-- Title -->
<title>Sporepedia Prototype</title>
</head>
<body onload="bootup();tabSkip();selectUpdate();screenCheck()">
<!-- Web Title -->
<header class="sp_title"><h1>SPOREPEDIA</h1></header>
<div class="sp_nav_divider">
<!-- Navigation -->
<nav class="sp_nav_container">
<a class="sp_nav" href="index.html"><img src="img/tab_icons/tab_home.png"></a>
<button class="sp_nav_music" onclick="play()">Music Player</button>
<button class="sp_nav_music" onclick="pause()">Music Stopper</button>
</nav>
<main class="sp_main_container"> <!-- Everything here will be organized horizontally-->
<!-- This duplicate will appear on mobile, while the other gets hidden -->
<div class="sp_page_ctrl_mobile">
<div>
<button onclick="pageLeft();selectUpdate();killThatRow();screenCheck()"><img src="img/menu_arrow.png" class="sp_page_reverse"</button>
</div>
<div class="sp_page_number">
<p id="c_page_m">1</p>
<p>/</p>
<p>6</p>
</div>
<div>
<button onclick="pageRight();selectUpdate();killThatRow();screenCheck()"><img src="img/menu_arrow.png" class="sp_page_forward"></button>
</div>
</div>
<!-- Main Card -->
<section class="sp_card_main">
<img src="" id="card_display" class="sp_card_main_img">
</section>
<!-- Description/Page -->
<section>
<div id="sp_desc_container"> <!-- Make this section be sorted vertically-->
<!-- Card Information -->
<article id="sp_info">
<!-- Creature Name -->
<div class="sp_info_mobile">
<h2 id="CD_N"></h2>
<img src="" id="icon_disp"></img>
</div>
<!-- Creature Description -->
<p id="CD_C"></p>
</article>
<!-- Page Controller -->
<div class="sp_page_ctrl">
<div>
<button onclick="pageLeft();selectUpdate();killThatRow()"><img src="img/menu_arrow.png" class="sp_page_reverse"</button>
</div>
<div class="sp_page_number">
<p id="c_page">1</p>
<p>/</p>
<p>6</p>
</div>
<div>
<button onclick="pageRight();selectUpdate();killThatRow()"><img src="img/menu_arrow.png" class="sp_page_forward"></button>
</div>
</div>
</div>
</section>
<!-- Card Selection Grid -->
<section class="sp_card_grid_container" id="grid_container"> <!-- This container is vertical -->
<div class="sp_card_grid_row"> <!-- Each row is horizontal -->
<button class="sp_card_select sp_card_select_bg" onclick="cardSelect(1);displayUpdate();descUpdate()"><img id="SC_01" src="" class="sp_card_select_img" value="1" loading="lazy"></input>
<button class="sp_card_select sp_card_select_bg" onclick="cardSelect(2);displayUpdate();descUpdate()"><img  id="SC_02" src="" class="sp_card_select_img"  value="2" loading="lazy"></button>
<button class="sp_card_select sp_card_select_bg"  onclick="cardSelect(3);displayUpdate();descUpdate()"><img id="SC_03" src="" class="sp_card_select_img"  value="3" loading="lazy"></button>
</div>
<div class="sp_card_grid_row">
<button class="sp_card_select sp_card_select_bg" onclick="cardSelect(4);displayUpdate();descUpdate()"><img id="SC_04" src="" class="sp_card_select_img"  value="4" loading="lazy"></button>
<button class="sp_card_select sp_card_select_bg" onclick="cardSelect(5);displayUpdate();descUpdate()"><img id="SC_05" src="" class="sp_card_select_img"  value="5" loading="lazy"></button>
<button class="sp_card_select sp_card_select_bg"  onclick="cardSelect(6);displayUpdate();descUpdate()"><img id="SC_06" src="" class="sp_card_select_img"  value="6" loading="lazy"></button>
</div>
<div class="sp_card_grid_row" id="KillThisRow">
<button class="sp_card_select sp_card_select_bg" onclick="cardSelect(7);displayUpdate();descUpdate()"><img id="SC_07" src="" class="sp_card_select_img"  value="7" loading="lazy"></button>
<button class="sp_card_select sp_card_select_bg" onclick="cardSelect(8);displayUpdate();descUpdate()"><img id="SC_08"  src="" class="sp_card_select_img"  value="8" loading="lazy"></button>
<button class="sp_card_select sp_card_select_bg" onclick="cardSelect(9);displayUpdate();descUpdate()"><img  id="SC_09" src="" class="sp_card_select_img"  value="9" loading="lazy"></button>
</div>
</section>
</main>
<!-- Category Tabs -->
<nav class="sp_category_container"> <!-- This section should be sorted vertically -->
	<!-- Cell tab -->
	<div class="sp_tab_solo">
	<button class="sp_category sp_tab_c" id="tab_cel" onclick="tabSkip(1);selectUpdate();cardJiggle(1)"></button>
	</div>
	<!-- Creature tab -->
	<div class="sp_tab_solo">
	<button class="sp_category sp_tab_cr" id="tab_cre" onclick="tabSkip(2);selectUpdate();cardJiggle(2)"></button>
	</div>
	<!-- Building tab -->
	<div class="sp_tab_solo">
	<button class="sp_category sp_tab_h" id="tab_hou" onclick="tabSkip(3);selectUpdate();cardJiggle(3)"></button>
	</div>
	<!-- Ship tab -->
	<div class="sp_tab_solo">
	<button class="sp_category sp_tab_s" id="tab_spa" onclick="tabSkip(4);selectUpdate()"></button>
	</div>
</nav>
</div>
</body>
<!-- Footer -->
<footer>
<p>>:(</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- All my scripts -->
<script src="scripts/Master_Var.js"></script>
<script src="scripts/Boot.js"></script>
<script src="scripts/Cat_Page.js"></script>
<script src="scripts/Card_Main_Select.js"></script>
<script src="scripts/Credit_DB.js"></script>
</html>

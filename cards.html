<script>
var db_audio_flg = document.getElementById("music-on");
  var audio = new Audio('bg-music.mp3');
function play() {
  if (audio_flg == 0) {
  audio.play();
  audio_flg = 1;
  db_audio_flg.textContent = audio_flg;
  }
}

function pause() {
if (audio_flg == 1) {
audio.pause();
audio.currentTime = 0;
audio_flg = 0;
db_audio_flg.textContent = audio_flg;
}
}
</script>

// ((Page Scripts)
// (Page Previous)
function pageLeft() {
C_Page_V = C_Page_V - 1;
M_C.src = "img/card_main/debug-slug.png";
S_C = 0;
db_S_C.textContent = S_C;
charName_Input.textContent = "Select a Creature"; // Reset Creature Name
charCredit_Input.textContent = ""; // Blank Description
if (C_Page_V == 0) {
if (T_State == 1 || 3) { //Cell and Building have no pages to turn
C_Page_V = 1;
}
if (T_State == 2) { //Creature loops back to page 3
C_Page_V = 3;
}
if (T_State == 4) { //Space loops back to page 2
C_Page_V = 2;
}
}
C_Page.textContent = C_Page_V;
}

// (Page Next)
function pageRight() {
C_Page_V = C_Page_V + 1;
M_C.src = "img/card_main/debug-slug.png";
S_C = 0;
db_S_C.textContent = S_C;
charName_Input.textContent = "Select a Creature"; // Reset Creature Name
charCredit_Input.textContent = ""; // Blank Description
if (T_State == 1) { //Cells only have 1 page of content
if (C_Page_V == 2) {
C_Page_V = 1;
}
}
if (T_State == 2) { //Creatures only have 3 page of content
if (C_Page_V == 4) {
C_Page_V = 1;
}
}
if (T_State == 3) { //Buildings only have 1 page of content
if (C_Page_V == 2) {
C_Page_V = 1;
}
}
if (T_State == 4) { //Planets only have 2 page of content
if (C_Page_V == 3) {
C_Page_V = 1;
}
}
C_Page.textContent = C_Page_V;
}
